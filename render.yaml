# ============================================================
# render.yaml — One-click deploy on Render.com
# ============================================================
# Render-la:  New → Blueprint → unga GitHub repo select pannunga → Apply
# Render ithu-la irundhu ellathayum automatic-ah setup pannidum.
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: shopkart
    runtime: python
    plan: free
    region: singapore          # India-ku closest free region (fast loading)
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 1 --threads 4 --timeout 60 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      # Strong secret key auto-generated by Render on first deploy
      - key: SECRET_KEY
        generateValue: true
      # Production mode (no debugger, secure cookies)
      - key: FLASK_DEBUG
        value: "0"
      # Marks HTTPS so session cookies get the Secure flag
      - key: HTTPS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # No DATABASE_URL  →  app uses SQLite and seeds demo data on boot.
      # Perfect for a demo link that always shows content.
      #
      # Want a real managed database? Uncomment below, add psycopg2-binary
      # to requirements.txt, and DB data will survive restarts:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: shopkart-db
      #     property: connectionString

# ============================================================
# Optional free Postgres (expires after 30 days on the free plan)
# Uncomment this block + the DATABASE_URL env var above to use it.
# ============================================================
