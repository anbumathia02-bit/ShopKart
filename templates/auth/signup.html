{% extends "base.html" %}
{% block title %}Sign Up — {{ STORE_NAME }}{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:480px">
  <div class="card-soft p-4">
    <div class="text-center mb-4">
      <div class="fs-1">🎉</div>
      <h5 class="fw-bold mb-1">Create your account</h5>
      <p class="text-muted small mb-0">Free account · Order tracking · Wishlist</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full name *</label>
        <input type="text" name="name" class="form-control" placeholder="Arun Kumar"
               value="{{ form.get('name', '') }}" required autofocus>
      </div>
      <div class="row g-3">
        <div class="col-sm-7 mb-3">
          <label class="form-label small fw-semibold">Email *</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com"
                 value="{{ form.get('email', '') }}" required>
        </div>
        <div class="col-sm-5 mb-3">
          <label class="form-label small fw-semibold">Phone</label>
          <input type="tel" name="phone" class="form-control" placeholder="9876543210"
                 value="{{ form.get('phone', '') }}" pattern="[0-9]{10}" maxlength="10">
        </div>
      </div>
      <div class="row g-3">
        <div class="col-sm-6 mb-3">
          <label class="form-label small fw-semibold">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="col-sm-6 mb-3">
          <label class="form-label small fw-semibold">Confirm password *</label>
          <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required minlength="6">
        </div>
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2">Create Account</button>
    </form>

    <div class="text-center small mt-3">
      Already member? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="text-brand fw-semibold">Login</a>
    </div>
    <div class="text-tiny text-muted text-center mt-3">
      Sign up panna unga <a href="#" class="text-muted">Terms</a> &amp; <a href="#" class="text-muted">Privacy Policy</a>-ku agree panreenga.
    </div>
  </div>
</div>
{% endblock %}
