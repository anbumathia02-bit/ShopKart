{% extends "base.html" %}
{% block title %}Login — {{ STORE_NAME }}{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:430px">
  <div class="card-soft p-4">
    <div class="text-center mb-4">
      <div class="fs-1">👋</div>
      <h5 class="fw-bold mb-1">Welcome back!</h5>
      <p class="text-muted small mb-0">Login panni continue pannunga</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com"
               value="{{ form.get('email', '') }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2">Login <i class="bi bi-arrow-right"></i></button>
    </form>

    <div class="text-center small mt-3">
      Account illaya? <a href="{{ url_for('auth.signup', next=request.args.get('next')) }}" class="text-brand fw-semibold">Sign up free</a>
    </div>

    <hr class="my-4">
    <div class="bg-light rounded-3 p-3 small">
      <div class="fw-bold mb-2"><i class="bi bi-key"></i> Demo accounts</div>
      <div class="d-flex justify-content-between"><span class="text-muted">Customer</span><code>arun@example.com / test123</code></div>
      <div class="d-flex justify-content-between"><span class="text-muted">Admin</span><code>admin@shopkart.com / admin123</code></div>
    </div>
  </div>
</div>
{% endblock %}
